<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alla Romana</title>
    <link rel="stylesheet" href="login.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&display=swap" rel="stylesheet">
</head>
<body>
   <section>
    <div>
        <a href="index.html"><img src="imgs/ALLA_ROMANA-removebg-preview.png" class="img-logo" alt="Logo Alla Romana"></a>
    </div>
   </section>

   <main class="container-forms">
    <form id="form-acesso" class="login-forms">
        <div class="botoes-topo">
            <button type="button" class="botao-forms entrar" id="botao-entrar">Entrar</button>
            <button type="button" class="botao-forms criar active" id="botao-criar">Criar minha conta</button>
        </div>

        <input type="text" placeholder="Nome Completo" id="nome" required>
        <input type="email" placeholder="Email" id="email" required>
        <input type="password" placeholder="Senha" id="senha" required>
        
        <button class="btn-entrar" type="submit" id="btn-submit">Criar</button>
    </form>
   </main>
   
   <footer class="container-copy">
         <div>
            <p id="font-footer">
                Feito com massa fresca e carinho · Alla Romana © 2026
            </p>
        </div>
   </footer>
   <script src="login.js"></script>
</body>
</html>
